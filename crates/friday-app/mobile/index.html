<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Friday">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<title>Friday</title>
</head>
<body>
<header>
  <span class="brand">F R I D A Y</span>
  <span class="status">
    <button id="pushBtn" style="padding:4px 8px;font-size:10px" aria-label="Notificações">◔ alertas</button>
    <span id="dot" class="dot"></span><span id="status">conectando</span>
  </span>
</header>

<main id="chat"></main>

<div class="pair hidden" id="pair">
  <p style="color:var(--dim);font-size:12px;line-height:1.6">
    Pareamento necessário. O código aparece na janela da Friday no Mac.
  </p>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
  <button class="primary" id="pairBtn">Parear</button>
</div>

<footer>
  <button id="mic" aria-label="Microfone">◉</button>
  <textarea id="input" rows="1" placeholder="fale com a friday…"></textarea>
  <button class="primary" id="send" aria-label="Enviar">↩</button>
</footer>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>

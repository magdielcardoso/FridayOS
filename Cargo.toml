[workspace]
resolver = "2"
members = ["crates/friday-core", "crates/friday-brain", "crates/friday-tools", "crates/friday-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
axum = { version = "0.8", features = ["ws"] }
web-push = "0.11"
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
